<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book API</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/books.css" />
  </head>

<body>
    <div id="toast" class="toast"></div>

    <!-- Navigation bar -->

    <nav class="nav-bar">

        <div class="navbar-brand">
            <div class="navbar-logo">
                <img src="/images/Book5.svg" alt="Bokhyllan Logo" />
            </div>

            <div class="navbar-text">
                <div class="navbar-title">Bokhyllan</div>
                <div class="navbar-description">• HITTA BÖCKER • LÄS RECENSIONER</div>
            </div>
        </div>

        <a href="admin-books.html" id="admin-btn" class="admin-btn">
            Adminpanel
        </a>

        <div class="user-area">

            <div class="user-info">
                <img src="/images/user.svg" alt="User Icon" class="user-icon" />
                <span id="username-display"></span>
            </div>

            <button id="logout-btn" class="logout-btn">
                Logga ut
            </button>

            <button id="login-btn" class="login-btn">
                Logga in
            </button>

        </div>

    </nav>

    <!-- Books Section -->
    <div class="Böcker">
      <h1>Böcker</h1>
      <div id="book-list"></div>

      <script src="/js/functions.js"></script>
      <script src="/js/books.js"></script>
    </div>

    <!-- Login overlay -->
    <div id="login-overlay">

        <div id="login-box">

            <button id="login-close">✕</button>

            <div class="login-tabs">

                <button id="show-login">
                    Logga in
                </button>

                <button id="show-register">
                    Registrera
                </button>

            </div>


            <!-- LOGIN -->

            <div id="login-view">

                <h2>Logga in</h2>

                <div id="login-message"></div>

                <form id="login-form">

                    <input
                        type="text"
                        id="username"
                        placeholder="Användarnamn"
                        required
                    >

                    <input
                        type="password"
                        id="password"
                        placeholder="Lösenord"
                        required
                    >

                    <button type="submit">
                        Logga in
                    </button>

                </form>

            </div>


            <!-- REGISTER -->

            <div id="register-view">

                <h2>Registrera användare</h2>

                <div id="register-message"></div>

                <form id="register-form">

                    <input
                        type="text"
                        id="register-username"
                        placeholder="Användarnamn"
                        required
                    >

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Lösenord"
                        required
                    >

                    <button type="submit">
                        Registrera
                    </button>

                </form>
            </div>
        </div>
    </div>

    <script src="js/functions.js"></script>
    <script src="/js/books.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
